<div class="navbar navbar-expand-sm navbar-dark bg-dark w-100">
  <div class="container">
    <a class="navbar-brand" routerLink="/">Route C44</a>
    <button
      class="navbar-toggler d-lg-none"
      type="button"
      data-bs-toggle="collapse"
      data-bs-target="#collapsibleNavId"
      aria-controls="collapsibleNavId"
      aria-expanded="false"
      aria-label="Toggle navigation"
    >
      <span class="navbar-toggler-icon"></span>
    </button>
    <div class="collapse navbar-collapse" id="collapsibleNavId">
      <ul class="navbar-nav me-auto mt-2 mt-lg-0">
        <li class="nav-item">
          <a
            class="nav-link text-capitalize"
            routerLink="/"
            routerLinkActive="rounded-2 bg-primary"
            [routerLinkActiveOptions]="{ exact: true }"
            >Home</a
          >
        </li>
        <li class="nav-item">
          <a
            class="nav-link text-capitalize"
            routerLink="about"
            routerLinkActive="rounded-2 bg-primary"
            >about</a
          >
        </li>
        <li class="nav-item">
          <a
            class="nav-link text-capitalize"
            routerLink="contact"
            routerLinkActive="rounded-2 bg-primary"
            >contact</a
          >
        </li>
      </ul>
    </div>
  </div>
</div>
